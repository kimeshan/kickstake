name: Tests

on:
  push:
    branches: [test, main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kickstake
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kickstake
      BETTER_AUTH_SECRET: ci-test-secret-at-least-32-chars!
      BETTER_AUTH_URL: http://localhost:3801

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run tests
        working-directory: packages/api
        run: pnpm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kickstake
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kickstake
      BETTER_AUTH_SECRET: ci-test-secret-at-least-32-chars!
      BETTER_AUTH_URL: http://localhost:3801
      CORS_ORIGIN: http://localhost:3800
      NEXT_PUBLIC_API_URL: http://localhost:3801
      NEXT_PUBLIC_APP_URL: http://localhost:3800
      E2E_BASE_URL: http://localhost:3800

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migrate + seed database
        run: pnpm db:migrate && pnpm db:seed

      - name: Build API
        run: pnpm --filter @kickstake/api build

      - name: Install Playwright (Chromium)
        run: pnpm --filter @kickstake/web exec playwright install --with-deps chromium

      - name: Start servers and run E2E
        working-directory: packages/web
        run: |
          node ../../packages/api/dist/main.js &
          pnpm dev &
          echo "Waiting for API + web..."
          for i in $(seq 1 90); do
            curl -fs http://localhost:3801/health >/dev/null 2>&1 \
              && curl -fs http://localhost:3800 >/dev/null 2>&1 && break
            sleep 2
          done
          pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 7
