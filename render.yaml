# KickStake – Render Blueprint (API + Web + Postgres)
# Test and Prod each get a Postgres DB, an API service, and a Web frontend.
# Non-secret env vars are set here; secrets (sync:false) are set per-service in
# the Dashboard after first deploy: RESEND_API_KEY, GOOGLE_CLIENT_ID/SECRET.
# (BETTER_AUTH_SECRET is auto-generated.)

databases:
  - name: kickstake-db-test
    databaseName: kickstake_test
    plan: free
  - name: kickstake-db-prod
    databaseName: kickstake_prod
    plan: basic-256mb

services:
  # ---- Test environment ----
  - type: web
    name: kickstake-api-test
    env: docker
    runtime: docker
    region: oregon
    plan: free
    branch: test
    dockerfilePath: ./packages/api/Dockerfile
    dockerContext: .
    buildCommand: ""
    startCommand: ""
    buildFilter:
      paths:
        - packages/api/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - packages/postgres/**
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kickstake-db-test
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://kickstake-api-test.onrender.com
      - key: CORS_ORIGIN
        value: https://kickstake-web-test.onrender.com
      - key: APP_URL
        value: https://kickstake-web-test.onrender.com
      - key: EMAIL_FROM
        value: KickStake <hello@kickstake.app>
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: web
    name: kickstake-web-test
    env: docker
    runtime: docker
    region: oregon
    plan: free
    branch: test
    dockerfilePath: ./packages/web/Dockerfile
    dockerContext: .
    buildCommand: ""
    startCommand: ""
    buildFilter:
      paths:
        - packages/web/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://kickstake-api-test.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://kickstake-web-test.onrender.com
      - key: NODE_ENV
        value: production

  # ---- Production environment ----
  - type: web
    name: kickstake-api-prod
    env: docker
    runtime: docker
    region: oregon
    plan: starter
    branch: main
    dockerfilePath: ./packages/api/Dockerfile
    dockerContext: .
    buildCommand: ""
    startCommand: ""
    buildFilter:
      paths:
        - packages/api/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - packages/postgres/**
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kickstake-db-prod
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://kickstake-api-prod.onrender.com
      - key: CORS_ORIGIN
        value: https://kickstake.app
      - key: APP_URL
        value: https://kickstake.app
      - key: EMAIL_FROM
        value: KickStake <hello@kickstake.app>
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: web
    name: kickstake-web-prod
    env: docker
    runtime: docker
    region: oregon
    plan: starter
    branch: main
    dockerfilePath: ./packages/web/Dockerfile
    dockerContext: .
    buildCommand: ""
    startCommand: ""
    buildFilter:
      paths:
        - packages/web/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://kickstake-api-prod.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://kickstake.app
      - key: NODE_ENV
        value: production
