# KickStake – Render Blueprint (API + Web + Postgres)
# Prod gets a Postgres DB, an API service, and a Web frontend.
#
# Custom domains (configure DNS at your registrar):
#   Prod web  → kickstake.app (+ www) and challenge.kickstake.app (activity
#               challenge, same web service)
#   Prod API  → api.kickstake.app
#
# Non-secret env vars are set here; secrets (sync:false) are set per-service in
# the Dashboard after first deploy: RESEND_API_KEY, GOOGLE_CLIENT_ID/SECRET.
# (BETTER_AUTH_SECRET is auto-generated.)

databases:
  - name: kickstake-db-prod
    databaseName: kickstake_prod
    plan: basic-256mb

services:
  # ---- Production environment ----
  - type: web
    name: kickstake-api-prod
    env: docker
    runtime: docker
    region: oregon
    plan: starter
    branch: main
    domains:
      - api.kickstake.app
    dockerfilePath: ./packages/api/Dockerfile
    dockerContext: .
    buildCommand: ""
    startCommand: ""
    buildFilter:
      paths:
        - packages/api/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - packages/postgres/**
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kickstake-db-prod
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://api.kickstake.app
      # Exact origins allowed for CORS, Better Auth and challenge mutations.
      # Keep the football origin; the challenge subdomain is added alongside.
      - key: CORS_ORIGIN
        value: https://kickstake.app,https://challenge.kickstake.app
      - key: APP_URL
        value: https://kickstake.app
      # Base URL for challenge invitation links (separate from APP_URL).
      - key: CHALLENGE_APP_URL
        value: https://challenge.kickstake.app
      - key: COOKIE_DOMAIN
        value: .kickstake.app
      - key: EMAIL_FROM
        value: KickStake <hello@kickstake.app>
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # football-data.org key — enables the daily live-results sync (in-process
      # cron; the API runs as a single instance so no separate worker needed).
      - key: FOOTBALL_DATA_API_KEY
        sync: false

  - type: web
    name: kickstake-web-prod
    env: docker
    runtime: docker
    region: oregon
    plan: starter
    branch: main
    domains:
      - kickstake.app
      - www.kickstake.app
      - challenge.kickstake.app
    dockerfilePath: ./packages/web/Dockerfile
    dockerContext: .
    buildCommand: ""
    startCommand: ""
    buildFilter:
      paths:
        - packages/web/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://api.kickstake.app
      - key: NEXT_PUBLIC_APP_URL
        value: https://kickstake.app
      # Build-time (inlined): challenge host matching + challenge metadata.
      - key: NEXT_PUBLIC_CHALLENGE_APP_URL
        value: https://challenge.kickstake.app
      - key: NODE_ENV
        value: production
