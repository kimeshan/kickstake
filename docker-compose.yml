# Local Postgres for KickStake.
# Auth: Better Auth (cookie sessions). DB: this for local, Render Postgres for deploy.
services:
  postgres:
    image: postgres:17.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kickstake
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kickstake"]
      interval: 2s
      timeout: 5s
      retries: 5
